[project]
name = "42-fly-in"
version = "0.1.0"
description = "Drone routing system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.2",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.20.1",
	"pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
